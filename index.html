<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campori 2026 - Cantina da Neta</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Paleta inspirada no Apple Dark Mode com toques em ouro/âmbar */
            --bg-base: #000000;
            --bg-elevated: #1c1c1e;
            --text-primary: #f2f2f7;
            --text-secondary: #aeaeb2;
            --text-tertiary: #8e8e93;
            --accent-gold: #f5b014;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: var(--bg-base);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            color: var(--text-primary);
            overscroll-behavior-y: none; 
        }
        
        h1, h2, h3, .font-serif { 
            font-family: 'Lora', serif; 
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- Fundo Premium Estático e Limpo --- */
        .bg-mesh {
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(245, 176, 20, 0.04), transparent 35%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.03), transparent 35%);
            background-color: var(--bg-base);
            background-attachment: fixed;
        }

        /* --- Animações --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-header {
            animation: fadeInDown 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUpFade 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0;
        }

        @keyframes softEntry {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-item-entry {
            animation: softEntry 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0;
        }

        /* --- Efeito Glassmorphism (Padrão iOS Material) --- */
        .glass-card {
            background: rgba(28, 28, 30, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px -8px rgba(0, 0, 0, 0.5);
        }
        
        .glass-nav {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #fde047, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        button, a {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-mesh">
    <div id="root" class="w-full max-w-[100vw] overflow-x-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ÍCONES SVG ---
        const IconBase = ({ children, className, viewBox = "0 0 24 24" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox={viewBox} fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Leaf = ({ className }) => <IconBase className={className}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></IconBase>;
        const Coffee = ({ className }) => <IconBase className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></IconBase>;
        const Sun = ({ className }) => <IconBase className={className}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconBase>;
        const Moon = ({ className }) => <IconBase className={className}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconBase>;
        const MapPin = ({ className }) => <IconBase className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>;
        const Star = ({ className }) => <IconBase className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;
        const Flame = ({ className }) => <IconBase className={className}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></IconBase>;
        const Utensils = ({ className }) => <IconBase className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></IconBase>;
        
        const WhatsAppIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
        );

        // --- DADOS DO CARDÁPIO ---
        const menuData = [
            {
                id: 'quinta',
                day: 'Quinta',
                date: '08/10',
                theme: 'Chegada & Acolhimento',
                icon: <MapPin className="w-5 h-5 text-blue-400" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã',
                        items: [
                            { label: 'Base', value: 'Pão com geleia' },
                            { label: 'Bolo', value: 'Bolos' },
                            { label: 'Fruta', value: 'Frutas' },
                            { label: 'Bebidas', value: 'Leite com cacau e suco' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço',
                        items: [
                            { label: 'Base', value: 'Arroz e Feijão' },
                            { label: 'Prato Principal', value: 'Macarrão cremoso', highlight: true },
                            { label: 'Acompanhamento', value: 'Lasanha' },
                            { label: 'Salada', value: 'Salada' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar',
                        items: [
                            { label: 'Prato Principal', value: 'Escondidinho', highlight: true },
                            { label: 'Acompanhamento', value: 'Omelete' },
                            { label: 'Base', value: 'Arroz' },
                            { label: 'Salada', value: 'Salada' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    }
                }
            },
            {
                id: 'sexta',
                day: 'Sexta',
                date: '09/10',
                theme: 'Convivência',
                icon: <Star className="w-5 h-5 text-yellow-400" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã',
                        items: [
                            { label: 'Base', value: 'Cuscuz com ovo' },
                            { label: 'Complemento', value: 'Biscoito' },
                            { label: 'Fruta', value: 'Frutas' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço',
                        items: [
                            { label: 'Base', value: 'Arroz e Feijão' },
                            { label: 'Prato Principal', value: 'Torta cremosa', highlight: true },
                            { label: 'Guarnição', value: 'Farofa' },
                            { label: 'Acompanhamento', value: 'Batatas ao forno' },
                            { label: 'Salada', value: 'Salada' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar',
                        items: [
                            { label: 'Prato Principal', value: 'Fricassé', highlight: true },
                            { label: 'Base', value: 'Arroz' },
                            { label: 'Guarnição', value: 'Farofa' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    }
                }
            },
            {
                id: 'sabado',
                day: 'Sábado',
                date: '10/10',
                theme: 'Dia de Guarda',
                icon: <Sun className="w-5 h-5 text-amber-400" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã',
                        items: [
                            { label: 'Base', value: 'Pão' },
                            { label: 'Complementos', value: 'Patê e geleia' },
                            { label: 'Bolo', value: 'Bolos' },
                            { label: 'Bebidas', value: 'Suco e cevada' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço',
                        items: [
                            { label: 'Base', value: 'Arroz e Feijão' },
                            { label: 'Prato Principal', value: 'Almôndegas', highlight: true },
                            { label: 'Guarnição', value: 'Purê de batatas-baroas' },
                            { label: 'Salada', value: 'Salada' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar',
                        items: [
                            { label: 'Prato Principal', value: 'Estrogonofe', highlight: true },
                            { label: 'Base', value: 'Arroz' },
                            { label: 'Acompanhamento', value: 'Batata cremosa' },
                            { label: 'Salada', value: 'Salada' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    }
                }
            },
            {
                id: 'domingo',
                day: 'Domingo',
                date: '11/10',
                theme: 'Dia de Atividades',
                icon: <Flame className="w-5 h-5 text-red-500" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã',
                        items: [
                            { label: 'Base', value: 'Cuscuz variados' },
                            { label: 'Proteína', value: 'Ovos mexido' },
                            { label: 'Complementos', value: 'Pão, leite com cacau, patê e geleia' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço',
                        items: [
                            { label: 'Base', value: 'Arroz e Feijão' },
                            { label: 'Prato Principal', value: 'Fricassé', highlight: true },
                            { label: 'Guarnição', value: 'Farofa e batata gratinada' },
                            { label: 'Salada', value: 'Salada e tabule assado' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar',
                        items: [
                            { label: 'Prato Principal', value: 'Macarronada', highlight: true },
                            { label: 'Molhos', value: 'Molho branco e molho vermelho' },
                            { label: 'Salada', value: 'Salada' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    }
                }
            },
            {
                id: 'segunda',
                day: 'Segunda',
                date: '12/10',
                theme: 'Encerramento & Viagem',
                icon: <MapPin className="w-5 h-5 text-emerald-400" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã',
                        items: [
                            { label: 'Base', value: 'Cuscuz temperado' },
                            { label: 'Quente', value: 'Canjiquinha' },
                            { label: 'Fruta', value: 'Frutas' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço',
                        items: [
                            { label: 'Base', value: 'Arroz e Feijão' },
                            { label: 'Prato Principal', value: 'Torta fria', highlight: true },
                            { label: 'Guarnição', value: 'Batata frita' },
                            { label: 'Acompanhamento', value: 'Abobrinha gratinada' },
                            { label: 'Salada', value: 'Salada' }
                        ]
                    },
                    dinner: {
                        title: 'Kit Viagem',
                        items: [
                            { label: 'Lanche', value: 'Sanduíche Natural', highlight: true },
                            { label: 'Opção Tradicional', value: 'Patê Cremoso de Frango', type: 'meat' },
                            { label: 'Opção Vegetariana', value: 'Patê de Cenoura com Ervas', type: 'veg' },
                            { label: 'Fruta', value: 'Frutas para viagem' }
                        ]
                    }
                }
            }
        ];

        // --- COMPONENTES ANIMADOS ---

        const MenuItem = ({ label, value, type, highlight, index }) => {
            let badgeClass = "";
            let textClass = "text-[var(--text-primary)]";
            let bgClass = "";

            if (type === 'meat') {
                badgeClass = "bg-red-900/30 text-red-300 border border-red-500/20";
                textClass = "text-zinc-200";
            } else if (type === 'veg') {
                badgeClass = "bg-emerald-900/30 text-emerald-300 border border-emerald-500/20";
                textClass = "text-zinc-200";
            } else if (highlight) {
                bgClass = "bg-white/5 border-l-2 border-[#f5b014] pl-3 py-2 my-2 rounded-r-lg";
                textClass = "text-white font-medium text-[15px] md:text-[16px]";
            } else {
                textClass = "text-[var(--text-secondary)] font-normal text-[14px] md:text-[15px]";
            }

            // Stagger animation puro via CSS (reativado a cada montagem da aba)
            const animationDelay = `${(index * 60) + 150}ms`;

            return (
                <div 
                    className={`mb-4 last:mb-0 group ${bgClass} animate-item-entry`} 
                    style={{ animationDelay }}
                >
                    <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                        <span className="text-[11px] md:text-xs uppercase tracking-[0.08em] text-[var(--text-tertiary)] font-semibold transition-colors duration-300 group-hover:text-zinc-300">
                            {label}
                        </span>
                        {type === 'meat' && (
                            <span className={`text-[10px] px-2 py-0.5 rounded-md uppercase font-semibold tracking-wide ${badgeClass}`}>
                                Opção Tradicional
                            </span>
                        )}
                        {type === 'veg' && (
                            <span className={`text-[10px] px-2 py-0.5 rounded-md uppercase font-semibold tracking-wide ${badgeClass}`}>
                                Opção Vegetariana
                            </span>
                        )}
                    </div>
                    <div className={`leading-relaxed ${textClass}`}>
                        {value}
                    </div>
                </div>
            );
        };

        const MealSection = ({ title, items, icon: Icon, sectionDelay }) => {
            if (!items) return null;
            
            return (
                <div 
                    className="glass-card rounded-2xl p-5 md:p-7 mb-6 animate-slide-up relative overflow-hidden"
                    style={{ animationDelay: `${sectionDelay}ms` }}
                >
                    <div className="flex items-center gap-3.5 mb-5 pb-4 border-b border-white/10">
                        <div className="text-[var(--accent-gold)]">
                            <Icon className="w-5 h-5" />
                        </div>
                        <h3 className="font-serif text-[19px] md:text-[22px] text-white font-normal tracking-tight">
                            {title}
                        </h3>
                    </div>
                    <div className="space-y-0">
                        {items.map((item, idx) => (
                            <MenuItem key={idx} index={idx} {...item} />
                        ))}
                    </div>
                </div>
            );
        };

        // --- CABEÇALHO DO DIA ---
        const DayHeader = ({ dayData }) => {
            const formatFullDate = (dateString) => {
                const [day, month] = dateString.split('/');
                const months = { '10': 'Outubro' };
                return `${day} de ${months[month] || 'Outubro'}`;
            };

            const dayName = `${dayData.day}${['quinta', 'sexta', 'segunda'].includes(dayData.id.toLowerCase()) ? '-feira' : ''}`;

            return (
                <div className="mb-6 flex items-center justify-between animate-slide-up" style={{animationDelay: '50ms'}}>
                    <div>
                        <h2 className="text-[22px] md:text-[26px] font-serif font-normal text-white tracking-tight flex flex-col md:flex-row md:items-baseline md:gap-2.5">
                            <span>{dayName}</span>
                            <span className="text-[13px] md:text-[15px] text-[var(--accent-gold)] font-sans font-medium tracking-wide opacity-90 mt-0.5 md:mt-0">
                                {formatFullDate(dayData.date)}
                            </span>
                        </h2>
                        {dayData.theme && (
                            <span className="text-[11px] md:text-xs text-[var(--text-tertiary)] font-medium tracking-wider uppercase mt-1 block">
                                {dayData.theme}
                            </span>
                        )}
                    </div>
                    <div className="p-2.5 bg-white/5 rounded-full border border-white/5 text-[var(--text-secondary)]">
                        {dayData.icon}
                    </div>
                </div>
            );
        };
        
        // --- BOTÃO DO WHATSAPP ---
        const FloatingWhatsAppButton = () => {
            const phoneNumber = "5577999052417";
            const message = encodeURIComponent("Olá! Gostaria de falar sobre o cardápio e fazer uma reserva na Cantina da Neta para o Campori 2026.");
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;

            return (
                <a 
                    href={whatsappUrl} 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="fixed bottom-6 right-5 md:bottom-8 md:right-8 z-[60] flex items-center gap-2.5 bg-[#248a3d] text-white px-5 py-3 rounded-full shadow-[0_8px_24px_rgba(36,138,61,0.4)] hover:bg-[#1f7835] transition-colors duration-200 border border-white/10"
                    aria-label="Fazer reserva via WhatsApp"
                    style={{ WebkitTapHighlightColor: 'transparent' }}
                >
                    <WhatsAppIcon className="w-5 h-5" />
                    <span className="font-medium text-[13px] md:text-sm tracking-wide pr-1">Reservas</span>
                </a>
            );
        };

        const MenuApp = () => {
            const [activeTab, setActiveTab] = useState(menuData[0].id);

            // Observer para atualizar a nav conforme o scroll
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setActiveTab(entry.target.id);
                            const activeBtn = document.getElementById(`tab-${entry.target.id}`);
                            const container = document.getElementById('tabs-container');
                            if (activeBtn && container) {
                                const scrollPos = activeBtn.offsetLeft - (container.offsetWidth / 2) + (activeBtn.offsetWidth / 2);
                                container.scrollTo({ left: scrollPos, behavior: 'smooth' });
                            }
                        }
                    });
                }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });

                menuData.forEach(day => {
                    const el = document.getElementById(day.id);
                    if (el) observer.observe(el);
                });

                return () => observer.disconnect();
            }, []);

            const scrollToSection = (dayId) => {
                const el = document.getElementById(dayId);
                if (el) {
                    const yOffset = el.getBoundingClientRect().top + window.scrollY - 70;
                    window.scrollTo({ top: yOffset, behavior: 'smooth' });
                }
            };

            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Ícone seta para cima
            const ChevronUp = ({ className }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="m18 15-6-6-6 6"/>
                </svg>
            );

            return (
                <div className="min-h-screen selection:bg-[var(--accent-gold)]/30 text-[var(--text-primary)] font-sans antialiased">
                    
                    {/* Header Topo */}
                    <header id="topo" className="pt-10 pb-6 px-5 max-w-2xl mx-auto flex flex-col items-center justify-center animate-header">
                        
                        <div className="inline-flex items-center gap-1.5 bg-white/10 backdrop-blur-md text-[var(--accent-gold)] px-3 py-1 rounded-full text-[10px] md:text-[11px] font-semibold uppercase tracking-[0.1em] mb-6 border border-white/5">
                            <Utensils className="w-3 h-3" />
                            <span>Cantina da Neta</span>
                        </div>

                        <div className="flex items-center justify-center gap-4 mb-4">
                            <img 
                                src="./compori.png" 
                                alt="Logo" 
                                className="w-12 md:w-14 h-auto object-contain drop-shadow-md"
                                onError={(e) => {
                                    const fallbackUrl = 'https://raw.githubusercontent.com/digitallawstrategy/campoeste_2026/main/compori.png';
                                    if (e.target.src !== fallbackUrl) e.target.src = fallbackUrl;
                                    else e.target.style.display = 'none';
                                }}
                            />
                            <h1 className="font-serif text-[28px] md:text-[34px] font-normal tracking-tight text-white leading-tight m-0">
                                Cardápio<br />
                                <span className="gold-gradient-text font-medium">Oficial</span>
                            </h1>
                        </div>

                        <p className="text-[var(--text-secondary)] text-[14px] md:text-[15px] italic font-serif text-center mt-1">
                            "A maior conquista exige a melhor energia."
                        </p>
                    </header>

                    {/* Navigation Tabs (Fixas no topo — agora rolam até a seção) */}
                    <div className="sticky top-0 z-50 glass-nav w-full shadow-md">
                        <div 
                            id="tabs-container"
                            className="flex overflow-x-auto scrollbar-hide snap-x snap-mandatory px-4 py-3 md:justify-center"
                            style={{ WebkitOverflowScrolling: 'touch' }}
                        >
                            <div className="flex space-x-2 min-w-max mx-auto px-2">
                                {menuData.map((day) => {
                                    const isActive = activeTab === day.id;
                                    return (
                                        <button
                                            key={day.id}
                                            id={`tab-${day.id}`}
                                            onClick={() => scrollToSection(day.id)}
                                            className={`
                                                snap-center relative px-5 py-2.5 rounded-xl transition-all duration-300 flex items-center justify-center min-w-[80px]
                                                ${isActive 
                                                    ? 'bg-[#2c2c2e] text-white shadow-sm border border-white/10' 
                                                    : 'text-[var(--text-secondary)] bg-transparent hover:bg-white/5'}
                                            `}
                                        >
                                            <div className="flex flex-col text-center pointer-events-none">
                                                <span className={`text-[14px] ${isActive ? 'font-semibold' : 'font-medium'}`}>
                                                    {day.day}
                                                </span>
                                                <span className={`text-[10px] uppercase tracking-wider mt-0.5 ${isActive ? 'text-[var(--accent-gold)]' : 'opacity-60'}`}>
                                                    {day.date}
                                                </span>
                                            </div>
                                        </button>
                                    )
                                })}
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area — Todos os dias em sequência */}
                    <main className="max-w-2xl mx-auto px-5 pt-8 pb-28 relative z-10">
                        
                        {menuData.map((dayData, dayIndex) => (
                            <section key={dayData.id} id={dayData.id} className="mb-4">
                                
                                {/* Checkpoint de navegação (a partir do segundo dia) */}
                                {dayIndex > 0 && (
                                    <div className="flex items-center justify-center gap-3 mb-8 pt-4">
                                        <button
                                            onClick={() => scrollToSection(menuData[dayIndex - 1].id)}
                                            className="flex items-center gap-1.5 text-[var(--text-tertiary)] hover:text-[var(--text-secondary)] transition-colors duration-200 text-[11px] uppercase tracking-[0.08em] font-semibold px-3 py-2 rounded-lg hover:bg-white/5"
                                        >
                                            <ChevronUp className="w-3.5 h-3.5" />
                                            {menuData[dayIndex - 1].day}
                                        </button>
                                        <span className="w-px h-4 bg-white/10"></span>
                                        <button
                                            onClick={scrollToTop}
                                            className="flex items-center gap-1.5 text-[var(--text-tertiary)] hover:text-[var(--accent-gold)] transition-colors duration-200 text-[11px] uppercase tracking-[0.08em] font-semibold px-3 py-2 rounded-lg hover:bg-white/5"
                                        >
                                            <ChevronUp className="w-3.5 h-3.5" />
                                            Início
                                        </button>
                                    </div>
                                )}

                                <DayHeader dayData={dayData} />

                                <div className="space-y-5">
                                    {dayData.meals.breakfast && (
                                        <MealSection 
                                            title={dayData.meals.breakfast.title}
                                            items={dayData.meals.breakfast.items}
                                            icon={Coffee}
                                            sectionDelay={100}
                                        />
                                    )}
                                    
                                    {dayData.meals.lunch && (
                                        <MealSection 
                                            title={dayData.meals.lunch.title}
                                            items={dayData.meals.lunch.items}
                                            icon={Sun}
                                            sectionDelay={150}
                                        />
                                    )}
                                    
                                    {dayData.meals.dinner && (
                                        <MealSection 
                                            title={dayData.meals.dinner.title}
                                            items={dayData.meals.dinner.items}
                                            icon={Moon}
                                            sectionDelay={200}
                                        />
                                    )}
                                </div>

                            </section>
                        ))}

                        {/* Footer Minimalista */}
                        <div className="mt-10 mb-8 flex flex-col items-center justify-center text-center animate-slide-up opacity-60" style={{animationDelay: '300ms'}}>
                            <Leaf className="w-5 h-5 text-[var(--text-secondary)] mb-2" />
                            <p className="text-[var(--text-tertiary)] text-[11px] uppercase tracking-[0.1em] font-medium">
                                Opções Tradicionais & Veg <br/> Cantina da Neta
                            </p>
                        </div>

                    </main>

                    {/* Botão Flutuante */}
                    <FloatingWhatsAppButton />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MenuApp />);
    </script>
</body>
</html>
