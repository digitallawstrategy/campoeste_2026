<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campori 2026 - Cantina da Neta</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fontes Novas: Inter (Corpo, limpa e estreita) e Lora (Títulos, elegante e fina) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #080c16; /* Fundo um tom mais escuro e sofisticado */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            color: #f8fafc;
        }
        h1, h2, h3, .font-serif { 
            font-family: 'Lora', serif; 
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- Fundo Premium --- */
        .bg-mesh {
            background-image: 
                radial-gradient(at 0% 0%, rgba(234, 179, 8, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(220, 38, 38, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.08) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(234, 179, 8, 0.05) 0px, transparent 50%);
            background-color: #080c16;
            background-attachment: fixed;
        }

        /* --- Animações Mais Suaves e Sofisticadas (Curva Apple-like) --- */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUpFade 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        @keyframes softEntry {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-item-entry {
            animation: softEntry 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        /* --- Efeito Glassmorphism Elegante e Sutil --- */
        .glass-card {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.5s ease, border-color 0.5s ease;
        }
        .glass-card:hover {
            border-color: rgba(234, 179, 8, 0.2);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            transform: translateY(-2px);
        }
        
        .glass-nav {
            background: rgba(8, 12, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(234, 179, 8, 0.1);
        }

        .gold-gradient-text {
            background: linear-gradient(to right, #fde047, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-mesh">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ÍCONES SVG INLINE ---
        const IconBase = ({ children, className, viewBox = "0 0 24 24" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox={viewBox} fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Leaf = ({ className }) => <IconBase className={className}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></IconBase>;
        const Coffee = ({ className }) => <IconBase className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></IconBase>;
        const Sun = ({ className }) => <IconBase className={className}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconBase>;
        const Moon = ({ className }) => <IconBase className={className}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconBase>;
        const MapPin = ({ className }) => <IconBase className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>;
        const Star = ({ className }) => <IconBase className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;
        const Flame = ({ className }) => <IconBase className={className}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></IconBase>;
        const Utensils = ({ className }) => <IconBase className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></IconBase>;
        
        const WhatsAppIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
        );

        // --- DADOS DO CARDÁPIO ---
        const menuData = [
            {
                id: 'quinta',
                day: 'Quinta',
                date: '08/10',
                theme: 'Chegada & Acolhimento',
                icon: <MapPin className="w-5 h-5 text-blue-400" />,
                meals: {
                    breakfast: {
                        title: 'Café de Boas-Vindas',
                        items: [
                            { label: 'Recepção', value: 'Pão francês, Pão de forma e Torradas' },
                            { label: 'Complementos', value: 'Frios variados, Manteiga e Geleia' },
                            { label: 'Fruta', value: 'Frutas da estação (Banana e Maçã)' },
                            { label: 'Bebidas', value: 'Café forte, Leite e Achocolatado' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço de Chegada',
                        items: [
                            { label: 'Base', value: 'Arroz Branco, Arroz Integral e Feijão' },
                            { label: 'Prato Principal', value: 'Iscas Douradas Aceboladas', highlight: true },
                            { label: 'Opção Tradicional', value: 'Iscas de Frango aceboladas', type: 'meat' },
                            { label: 'Opção Vegetariana', value: 'Iscas de Proteína de Soja (PTS) grossa', type: 'veg' },
                            { label: 'Acompanhamento', value: 'Farofa nutritiva e Salada de folhas verdes' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar de Recepção',
                        items: [
                            { label: 'Prato Principal', value: 'Torta Cremosa de Forno' },
                            { label: 'Opção Tradicional', value: 'Recheio de Frango com requeijão', type: 'meat' },
                            { label: 'Opção Vegetariana', value: 'Recheio de Palmito, milho e azeitonas', type: 'veg' },
                            { label: 'Acompanhamento', value: 'Sopa Creme de Legumes com torradinhas' }
                        ]
                    }
                }
            },
            {
                id: 'sexta',
                day: 'Sexta',
                date: '09/10',
                theme: 'Abertura de Campo',
                icon: <Star className="w-5 h-5 text-yellow-400" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã',
                        items: [
                            { label: 'Base', value: 'Pão francês com Patê e Geleia' },
                            { label: 'Proteína', value: 'Ovos mexidos temperados' },
                            { label: 'Complementos', value: 'Bolo Caseiro e Frutas' },
                            { label: 'Bebidas', value: 'Leite, Achocolatado ou Chá' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço Oficial',
                        items: [
                            { label: 'Base', value: 'Arroz Branco e Feijão de caldo grosso' },
                            { label: 'Prato Principal', value: 'Lasanha Farta ao Forno', highlight: true },
                            { label: 'Opção Tradicional', value: 'Lasanha à Bolonhesa (Carne Moída)', type: 'meat' },
                            { label: 'Opção Vegetariana', value: 'Lasanha de Proteína de Soja ao Sugo', type: 'veg' },
                            { label: 'Acompanhamento', value: 'Salpicão Refrescante (Tradicional ou Veg)' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar',
                        items: [
                            { label: 'Prato Principal', value: 'Strogonoff Cremoso', highlight: true },
                            { label: 'Opção Tradicional', value: 'Strogonoff de Frango', type: 'meat' },
                            { label: 'Opção Vegetariana', value: 'Strogonoff de Grão de bico e palmito', type: 'veg' },
                            { label: 'Acompanhamento', value: 'Arroz Branco e Batata Palha' }
                        ]
                    }
                }
            },
            {
                id: 'sabado',
                day: 'Sábado',
                date: '10/10',
                theme: 'Dia de Guarda',
                icon: <Sun className="w-5 h-5 text-amber-400" />,
                meals: {
                    breakfast: {
                        title: 'Café Especial',
                        items: [
                            { label: 'Base', value: 'Pães variados (Doce e Salgado)' },
                            { label: 'Bolo', value: 'Bolo do Dia (Caseiro)' },
                            { label: 'Fruta', value: 'Salada de frutas frescas' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço de Sábado',
                        items: [
                            { label: 'Prato Principal', value: 'Escondidinho Especial', highlight: true },
                            { label: 'Opção Tradicional', value: 'Escondidinho de Carne Moída', type: 'meat' },
                            { label: 'Opção Vegetariana', value: 'Escondidinho de Proteína de soja com azeitonas', type: 'veg' },
                            { label: 'Acompanhamento', value: 'Batata Gratinada aos quatro queijos' },
                            { label: 'Salada', value: 'Mix de folhas e vegetais' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar',
                        items: [
                            { label: 'Prato Principal', value: 'Almôndegas ao Molho Sugo', highlight: true },
                            { label: 'Opção Tradicional', value: 'Almôndegas de Carne Moída', type: 'meat' },
                            { label: 'Opção Vegetariana', value: 'Almôndegas de Soja/Grão de bico', type: 'veg' },
                            { label: 'Acompanhamento', value: 'Purê de Batata cremoso e Arroz Branco' }
                        ]
                    }
                }
            },
            {
                id: 'domingo',
                day: 'Domingo',
                date: '11/10',
                theme: 'Aventura & Atividades',
                icon: <Flame className="w-5 h-5 text-red-500" />,
                meals: {
                    breakfast: {
                        title: 'Café Regional',
                        items: [
                            { label: 'Base', value: 'Cuscuz Nordestino' },
                            { label: 'Proteína', value: 'Ovos mexidos com queijo' },
                            { label: 'Bebidas', value: 'Suco natural e Café' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço Forte',
                        items: [
                            { label: 'Base', value: 'Arroz à Grega e Feijão' },
                            { label: 'Prato Principal', value: 'Fricassê Cremoso ao Forno', highlight: true },
                            { label: 'Opção Tradicional', value: 'Fricassê de Frango', type: 'meat' },
                            { label: 'Opção Vegetariana', value: 'Fricassê de Palmito com milho', type: 'veg' },
                            { label: 'Acompanhamento', value: 'Batata Palha e Farofa Rica' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar Extra',
                        items: [
                            { label: 'Prato Único', value: 'Macarronada de Domingo' },
                            { label: 'Molhos', value: 'Bolonhesa (Carne) e Sugo Tradicional (Veg)' },
                            { label: 'Complemento', value: 'Queijo parmesão ralado à vontade' }
                        ]
                    }
                }
            },
            {
                id: 'segunda',
                day: 'Segunda',
                date: '12/10',
                theme: 'Encerramento & Viagem',
                icon: <MapPin className="w-5 h-5 text-emerald-400" />,
                meals: {
                    breakfast: {
                        title: 'Café de Despedida',
                        items: [
                            { label: 'Mesa Farta', value: 'Mesa com biscoitos, pães e frutas' },
                            { label: 'Especial', value: 'Canjica de leite doce' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço de Fechamento',
                        items: [
                            { label: 'Prato', value: 'Panquecas Recheadas Gratinadas' },
                            { label: 'Opções', value: 'Carne Moída, Frango e Queijo (Veg)' },
                            { label: 'Acompanhamento', value: 'Arroz, Feijão e Ovos Fritos' }
                        ]
                    },
                    dinner: {
                        title: 'Kit Viagem',
                        items: [
                            { label: 'Kit Lanche', value: 'Sanduíche Natural' },
                            { label: 'Recheios', value: 'Frango desfiado ou Patê de Cenoura (Veg)' },
                            { label: 'Complemento', value: 'Frutas para a viagem' }
                        ]
                    }
                }
            }
        ];

        // --- COMPONENTES ---

        const MenuItem = ({ label, value, type, highlight, index }) => {
            let badgeClass = "";
            let textClass = "text-slate-300";
            let bgClass = "";

            if (type === 'meat') {
                badgeClass = "bg-red-500/10 text-red-400 border border-red-500/20";
                textClass = "text-slate-200";
            } else if (type === 'veg') {
                badgeClass = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                textClass = "text-slate-200";
            } else if (highlight) {
                bgClass = "bg-yellow-500/5 border-l border-yellow-500/50 pl-3 py-1.5 my-1.5 rounded-r-md";
                textClass = "text-yellow-50 font-medium text-[13px] md:text-sm";
            } else {
                textClass = "text-slate-300 font-light text-[13px] md:text-sm";
            }

            const animationDelay = `${(index * 80) + 200}ms`;

            return (
                <div 
                    className={`mb-3.5 last:mb-0 group ${bgClass} animate-item-entry`} 
                    style={{ animationDelay }}
                >
                    <div className="flex items-center gap-2.5 mb-1">
                        <span className="text-[9px] md:text-[10px] uppercase tracking-[0.1em] text-slate-500 font-medium transition-colors duration-500 group-hover:text-yellow-500/70">
                            {label}
                        </span>
                        {type === 'meat' && (
                            <span className={`text-[8px] px-1.5 py-0.5 rounded uppercase font-medium tracking-wide ${badgeClass}`}>
                                Opção com Carne
                            </span>
                        )}
                        {type === 'veg' && (
                            <span className={`text-[8px] px-1.5 py-0.5 rounded uppercase font-medium tracking-wide ${badgeClass}`}>
                                Opção Veg
                            </span>
                        )}
                    </div>
                    <div className={`leading-relaxed ${textClass} transition-transform duration-500 ease-out group-hover:translate-x-0.5`}>
                        {value}
                    </div>
                </div>
            );
        };

        const MealSection = ({ title, items, icon: Icon, sectionDelay }) => {
            if (!items) return null;
            
            return (
                <div 
                    className="glass-card rounded-[1.25rem] p-5 md:p-6 mb-6 animate-slide-up relative overflow-hidden group"
                    style={{ animationDelay: `${sectionDelay}ms` }}
                >
                    <div className="absolute left-0 top-0 bottom-0 w-[3px] bg-gradient-to-b from-yellow-500/40 to-transparent"></div>
                    
                    <div className="flex items-center gap-3 mb-4 pb-3 border-b border-white/5">
                        <div className="text-yellow-500/80 transition-transform duration-500 group-hover:scale-110 group-hover:text-yellow-400">
                            <Icon className="w-4 h-4 md:w-5 md:h-5" />
                        </div>
                        <h3 className="font-serif text-lg md:text-xl text-slate-100 font-normal tracking-wide">
                            {title}
                        </h3>
                    </div>
                    <div className="space-y-0">
                        {items.map((item, idx) => (
                            <MenuItem key={idx} index={idx} {...item} />
                        ))}
                    </div>
                </div>
            );
        };
        
        // --- BOTÃO DO WHATSAPP ---
        const FloatingWhatsAppButton = () => {
            const phoneNumber = "5577999052417";
            const message = encodeURIComponent("Olá! Gostaria de falar sobre o cardápio e fazer uma reserva na Cantina da Neta para o Campori 2026.");
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;

            return (
                <a 
                    href={whatsappUrl} 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="fixed bottom-5 right-4 md:bottom-6 md:right-6 z-[60] flex items-center gap-2 bg-gradient-to-r from-emerald-600 to-emerald-700 text-white px-4 py-2.5 rounded-full shadow-[0_8px_20px_rgba(5,150,105,0.2)] transform hover:scale-105 transition-all duration-500 border border-emerald-500/30 group"
                    aria-label="Fazer reserva via WhatsApp"
                >
                    <span className="absolute -top-1 -right-1 flex h-3 w-3">
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-60" style={{ animationDuration: '3s' }}></span>
                        <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500 border border-[#080c16]"></span>
                    </span>
                    
                    <WhatsAppIcon className="w-4 h-4 group-hover:rotate-6 transition-transform duration-500" />
                    <span className="font-medium text-[11px] tracking-widest uppercase pr-1">Reservas</span>
                </a>
            );
        };

        const MenuApp = () => {
            const [activeDay, setActiveDay] = useState('quinta');

            useEffect(() => {
                const activeBtn = document.getElementById(`tab-${activeDay}`);
                const container = document.getElementById('tabs-container');
                if (activeBtn && container) {
                    const scrollPos = activeBtn.offsetLeft - (container.offsetWidth / 2) + (activeBtn.offsetWidth / 2);
                    container.scrollTo({ left: scrollPos, behavior: 'smooth' });
                }
            }, [activeDay]);

            const currentDayData = menuData.find(d => d.id === activeDay);

            return (
                <div className="min-h-screen selection:bg-yellow-500/20 text-slate-200">
                    
                    {/* Header Hero */}
                    <header className="pt-12 pb-8 px-5 relative text-center">
                        <div className="max-w-2xl mx-auto animate-slide-up" style={{ animationDelay: '0ms' }}>
                            
                            <div className="relative mb-8 flex flex-col items-center justify-center">
                                {/* Glow sutil */}
                                <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-yellow-500/10 blur-[60px] rounded-full z-0 pointer-events-none"></div>
                                
                                {/* Logo Reduzida e Estática (com hover sutil) */}
                                <img 
                                    src="./compori.png" 
                                    alt="Logotipo IV Campori MBSo" 
                                    className="relative w-28 md:w-36 h-auto object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.4)] z-10 transition-transform duration-700 hover:scale-[1.02]"
                                    onError={(e) => {
                                        const fallbackUrl = 'https://raw.githubusercontent.com/digitallawstrategy/campoeste_2026/main/compori.png';
                                        if (e.target.src !== fallbackUrl) {
                                            e.target.src = fallbackUrl;
                                        } else {
                                            e.target.style.display = 'none';
                                        }
                                    }}
                                />
                            </div>
                            
                            <div className="inline-flex items-center gap-2 bg-white/5 backdrop-blur-sm text-yellow-500/90 px-4 py-1.5 rounded-full text-[10px] font-medium uppercase tracking-[0.15em] mb-4 border border-yellow-500/10 cursor-default">
                                <Utensils className="w-3 h-3" />
                                Cantina da Neta
                            </div>
                            
                            <h1 className="font-serif text-2xl md:text-4xl font-normal mb-2 text-slate-50 tracking-wide drop-shadow-sm">
                                Cardápio <span className="gold-gradient-text font-medium">Oficial</span>
                            </h1>
                            
                            <p className="text-slate-400/80 text-[13px] md:text-sm italic font-serif max-w-sm mx-auto leading-relaxed font-light">
                                "A maior conquista exige a melhor energia."
                            </p>
                        </div>
                    </header>

                    {/* Navigation Tabs (Mais finas e discretas) */}
                    <div className="sticky top-0 z-50 glass-nav w-full shadow-lg">
                        <div 
                            id="tabs-container"
                            className="flex overflow-x-auto scrollbar-hide snap-x snap-mandatory px-4 py-3 md:justify-center"
                        >
                            <div className="flex space-x-2 min-w-max mx-auto px-2">
                                {menuData.map((day) => (
                                    <button
                                        key={day.id}
                                        id={`tab-${day.id}`}
                                        onClick={() => setActiveDay(day.id)}
                                        className={`
                                            snap-center relative px-4 py-2 rounded-xl text-xs transition-all duration-500 flex items-center gap-2 select-none overflow-hidden
                                            ${activeDay === day.id 
                                                ? 'bg-slate-800/80 text-yellow-50 border border-yellow-500/20 shadow-md' 
                                                : 'text-slate-400 bg-transparent hover:bg-white/5 hover:text-slate-200 border border-transparent'}
                                        `}
                                    >
                                        <div className="flex flex-col text-left relative z-10">
                                            <span className={`leading-none text-[13px] ${activeDay === day.id ? 'font-medium' : 'font-normal'}`}>
                                                {day.day}
                                            </span>
                                            <span className={`text-[9px] uppercase tracking-wider mt-1 opacity-70 ${activeDay === day.id ? 'font-medium text-yellow-400/80' : 'font-normal'}`}>
                                                {day.date}
                                            </span>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Main Content (Forçando recarregamento com a key no container) */}
                    <main className="max-w-2xl mx-auto px-4 pt-10 pb-24 relative z-10" key={`content-${activeDay}`}>
                        
                        <div className="mb-8 flex items-center justify-between border-b border-white/5 pb-4 animate-slide-up" style={{animationDelay: '100ms'}}>
                            <div>
                                <h2 className="text-xl md:text-2xl font-serif font-normal text-slate-100 tracking-wide">
                                    {currentDayData.day}{['quinta', 'sexta', 'segunda'].includes(currentDayData.id) ? '-feira' : ''}
                                </h2>
                                {currentDayData.theme && (
                                    <span className="text-[10px] md:text-xs text-slate-500 font-medium tracking-[0.1em] uppercase mt-1 block">
                                        {currentDayData.theme}
                                    </span>
                                )}
                            </div>
                            <div className="p-2 bg-white/5 rounded-lg border border-white/5 text-slate-400">
                                {currentDayData.icon}
                            </div>
                        </div>

                        {/* Meals Grid */}
                        <div className="space-y-6">
                            {currentDayData.meals.breakfast && (
                                <MealSection 
                                    title={currentDayData.meals.breakfast.title}
                                    items={currentDayData.meals.breakfast.items}
                                    icon={Coffee}
                                    sectionDelay={200}
                                />
                            )}
                            
                            {currentDayData.meals.lunch && (
                                <MealSection 
                                    title={currentDayData.meals.lunch.title}
                                    items={currentDayData.meals.lunch.items}
                                    icon={Sun}
                                    sectionDelay={300}
                                />
                            )}
                            
                            {currentDayData.meals.dinner && (
                                <MealSection 
                                    title={currentDayData.meals.dinner.title}
                                    items={currentDayData.meals.dinner.items}
                                    icon={Moon}
                                    sectionDelay={400}
                                />
                            )}
                        </div>

                        {/* Footer Elegante */}
                        <div className="mt-12 p-6 glass-card rounded-2xl text-center animate-slide-up relative overflow-hidden" style={{animationDelay: '500ms'}}>
                            <Leaf className="w-5 h-5 text-emerald-500/60 mx-auto mb-3 fill-current" />
                            <p className="text-slate-300 font-serif font-normal text-sm md:text-base mb-2 tracking-wide">
                                "Energia farta e cardápio flexível."
                            </p>
                            <p className="text-slate-500/80 text-[9px] mt-2 uppercase tracking-[0.15em] font-medium">
                                Opções Tradicionais & Veg • Cantina da Neta
                            </p>
                        </div>

                    </main>

                    {/* Botão Flutuante do WhatsApp */}
                    <FloatingWhatsAppButton />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MenuApp />);
    </script>
</body>
</html>
