<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campori 2026 - Cantina da Neta</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Noto Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        h1, h2, h3, .font-serif { 
            font-family: 'Playfair Display', serif; 
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- Fundo Animado Premium --- */
        .bg-dynamic {
            background: linear-gradient(-45deg, #1e3a8a, #7f1d1d, #9a3412, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Animações de Entrada --- */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(250, 204, 21, 0); }
            100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 2s infinite;
        }

        /* --- Efeito Glassmorphism --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }
        
        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(250, 204, 21, 0.2);
        }
    </style>
</head>
<body class="bg-dynamic text-stone-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ÍCONES SVG INLINE ---
        const IconBase = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Leaf = ({ className }) => <IconBase className={className}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></IconBase>;
        const Coffee = ({ className }) => <IconBase className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></IconBase>;
        const Sun = ({ className }) => <IconBase className={className}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconBase>;
        const Moon = ({ className }) => <IconBase className={className}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconBase>;
        const MapPin = ({ className }) => <IconBase className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>;
        const Calendar = ({ className }) => <IconBase className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconBase>;
        const Star = ({ className }) => <IconBase className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;
        const Biceps = ({ className }) => <IconBase className={className}><path d="M20.4 18.9c.2.5-.1 1.2-.6 1.3l-1.9.4c-5.5 1.1-11.1-.4-15.4-4.1-.4-.4-.5-1-.2-1.4l1.2-1.6c.3-.4 1-.5 1.4-.2 3.6 2.4 8.2 3.5 12.6 2.4l1.9-.4c.5-.1 1.1.2 1.2.7z"/><path d="M8 7.3A5 5 0 0 1 12 5a5 5 0 0 1 4 2.3c1.4 2.1 2 4.6 1.8 7.1l-.2 1.7"/></IconBase>;

        // --- DADOS DO CARDÁPIO (100% Ovolactovegetariano) ---
        const menuData = [
            {
                id: 'quinta',
                day: 'Quinta',
                date: '08/10',
                theme: 'Chegada & Acolhimento',
                icon: <MapPin className="w-8 h-8 text-blue-500 animate-float" />,
                meals: {
                    dinner: {
                        title: 'Jantar de Recepção',
                        items: [
                            { label: 'Prato Único', value: 'Sopa Creme de Legumes Rústica' },
                            { label: 'Complementos', value: 'Torradinhas crocantes' },
                            { label: 'Sobremesa', value: 'Fruta da estação' }
                        ]
                    }
                }
            },
            {
                id: 'sexta',
                day: 'Sexta',
                date: '09/10',
                theme: 'Abertura de Campo',
                icon: <Star className="w-8 h-8 text-yellow-500 animate-float" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã',
                        items: [
                            { label: 'Base', value: 'Pão com Patê e Geleia' },
                            { label: 'Proteína', value: 'Ovos mexidos temperados' },
                            { label: 'Bolo', value: 'Bolo Caseiro' },
                            { label: 'Fruta', value: 'Frutas da estação' },
                            { label: 'Bebidas', value: 'Leite ou Chá' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço Turbinado',
                        items: [
                            { label: 'Base', value: 'Arroz Branco e Feijão de caldo grosso' },
                            { label: 'Energia Pura', value: 'Ovos fritos/mexidos turbinados e Muita Batata Rústica Assada', sustancia: true },
                            { label: 'Acompanhamento', value: 'Farofa Crocante de Alho (Caprichada na textura)' },
                            { label: 'Salada', value: 'Salada Refrescante (Pepino e Tomate)' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar',
                        items: [
                            { label: 'Prato Único', value: 'Macarronada Especial' },
                            { label: 'Molho Vegetariano', value: 'Molho Branco com Queijo ou Sugo Rico' },
                            { label: 'Dica', value: 'Queijo ralado à vontade' },
                            { label: 'Bebida', value: 'Suco de Frutas' }
                        ]
                    }
                }
            },
            {
                id: 'sabado',
                day: 'Sábado',
                date: '10/10',
                theme: 'Dia de Guarda',
                icon: <Sun className="w-8 h-8 text-yellow-400 animate-float" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã',
                        items: [
                            { label: 'Base', value: 'Pães variados' },
                            { label: 'Bolo', value: 'Bolo do Dia (Sabor Caseiro)' },
                            { label: 'Fruta', value: 'Frutas da estação' },
                            { label: 'Bebidas', value: 'Leite com chocolate, suco' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço Turbinado',
                        items: [
                            { label: 'Base', value: 'Arroz Branco, Arroz Integral, Feijão' },
                            { label: 'Prato Principal', value: 'Strogonoff Vegetariano cremoso (Proteína de soja e Grão de Bico)' },
                            { label: 'Energia Pura', value: 'Montanha de Batata Palha e Ovos Cozidos Temperados', sustancia: true },
                            { label: 'Guarnição', value: 'Abóbora Cabotiá refogada' },
                            { label: 'Salada', value: 'Folhas frescas e Vegetais' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar',
                        items: [
                            { label: 'Prato Principal', value: 'Escondidinho de batata Cremoso (Gratinado com Queijo)' },
                            { label: 'Recheio', value: 'Opção Vegetariana Especial com Cogumelos' },
                            { label: 'Acompanhamento', value: 'Arroz Branco soltinho' },
                            { label: 'Sobremesa', value: 'Frutas da estação' }
                        ]
                    }
                }
            },
            {
                id: 'domingo',
                day: 'Domingo',
                date: '11/10',
                theme: 'Aventura & Atividades',
                icon: <Biceps className="w-8 h-8 text-red-500 animate-float" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã Regional',
                        items: [
                            { label: 'Estrela', value: 'Cuscuz Nordestino' },
                            { label: 'Proteína', value: 'Ovos mexidos com queijo' },
                            { label: 'Base', value: 'Biscoitos variados' },
                            { label: 'Bebidas', value: 'Suco de fruta e Café de cevada' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço Turbinado',
                        items: [
                            { label: 'Base', value: 'Arroz à Grega e Feijão' },
                            { label: 'Prato Principal', value: 'Almôndegas de Proteína de Soja ao molho com Queijo' },
                            { label: 'Energia Pura', value: 'Purê de Batata farto e Farofa Rica de Ovos', sustancia: true },
                            { label: 'Salada', value: 'Salada de Repolho tropical' },
                            { label: 'Bebida', value: 'Suco de Fruta' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar Extra',
                        items: [
                            { label: 'Prato Único', value: 'Rocambole de Proteína ao Forno Gratinado com Queijo e Legumes' },
                            { label: 'Acompanhamento', value: 'Arroz Branco e Salada Refrescante' },
                            { label: 'Bebida', value: 'Suco Natural' }
                        ]
                    }
                }
            },
            {
                id: 'segunda',
                day: 'Segunda',
                date: '12/10',
                theme: 'Encerramento & Viagem',
                icon: <MapPin className="w-8 h-8 text-emerald-500 animate-float" />,
                meals: {
                    breakfast: {
                        title: 'Café de Despedida',
                        items: [
                            { label: 'Especial', value: 'Mesa de Despedida (biscoitos, pães, frutas)' },
                            { label: 'Quente', value: 'Canjica de leite' },
                            { label: 'Bebida', value: 'Suco de Frutas' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço Turbinado',
                        items: [
                            { label: 'Base', value: 'Arroz Branco e Feijão' },
                            { label: 'Prato Principal', value: 'Fricassê Cremoso Vegetariano (Palmito/Legumes com Creme de Milho)' },
                            { label: 'Energia Pura', value: 'Batata Palha Extra e Ovos Fritos Fatiados no Azeite', sustancia: true },
                            { label: 'Salada', value: 'Vinagrete da Casa' }
                        ]
                    },
                    dinner: {
                        title: 'Kit Viagem',
                        items: [
                            { label: 'Kit Lanche', value: 'Sanduíche Natural' },
                            { label: 'Recheio', value: 'Patê de Cenoura com Ervas' },
                            { label: 'Fruta', value: 'Frutas para viagem' }
                        ]
                    }
                }
            }
        ];

        // --- COMPONENTES ---

        const MenuItem = ({ label, value, sustancia }) => (
            <div className="mb-4 last:mb-0 group">
                <span className="block text-[11px] uppercase tracking-widest text-stone-400 font-bold mb-1 transition-colors group-hover:text-stone-600">
                    {label}
                </span>
                <div className={`text-sm md:text-base leading-relaxed transition-all duration-300 ${
                    sustancia 
                    ? 'bg-gradient-to-r from-yellow-50 to-orange-50 border-l-4 border-yellow-500 p-3 rounded-r-xl text-stone-800 font-bold shadow-sm' 
                    : 'text-stone-700 font-medium'
                }`}>
                    {sustancia && <Biceps className="w-5 h-5 inline mr-2 text-yellow-600 -mt-1" />}
                    {value}
                </div>
            </div>
        );

        const MealSection = ({ title, items, icon: Icon, delay }) => {
            if (!items) return null;
            
            return (
                <div 
                    className="glass-panel rounded-3xl p-6 md:p-8 mb-8 animate-slide-up hover:-translate-y-1 hover:shadow-2xl transition-all duration-300 border-t-4 border-t-yellow-400"
                    style={{ animationDelay: `${delay}ms` }}
                >
                    <div className="flex items-center gap-4 mb-6 pb-4 border-b border-stone-200">
                        <div className="p-3 bg-gradient-to-br from-yellow-100 to-amber-100 rounded-2xl text-yellow-700 shadow-inner">
                            <Icon className="w-6 h-6" />
                        </div>
                        <h3 className="font-serif text-2xl md:text-3xl text-stone-900 font-bold tracking-tight">
                            {title}
                        </h3>
                    </div>
                    <div className="space-y-2">
                        {items.map((item, idx) => (
                            <MenuItem key={idx} {...item} />
                        ))}
                    </div>
                </div>
            );
        };

        const MenuApp = () => {
            const [activeDay, setActiveDay] = useState('quinta');

            useEffect(() => {
                const activeBtn = document.getElementById(`tab-${activeDay}`);
                const container = document.getElementById('tabs-container');
                if (activeBtn && container) {
                    const scrollPos = activeBtn.offsetLeft - (container.offsetWidth / 2) + (activeBtn.offsetWidth / 2);
                    container.scrollTo({ left: scrollPos, behavior: 'smooth' });
                }
            }, [activeDay]);

            const currentDayData = menuData.find(d => d.id === activeDay);

            return (
                <div className="min-h-screen font-sans selection:bg-yellow-300 pb-12">
                    
                    {/* Header Hero com Imagem Direta */}
                    <header className="pt-16 pb-12 px-5 relative text-center">
                        <div className="max-w-3xl mx-auto animate-slide-up" style={{ animationDelay: '0ms' }}>
                            
                            <div className="relative mb-8 flex flex-col items-center justify-center min-h-[250px]">
                                <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-yellow-400 blur-[80px] opacity-40 rounded-full animate-pulse-glow z-0"></div>
                                
                                {/* Chamada direta, limpa e nativa para a imagem local */}
                                <img 
                                    src="image.png" 
                                    alt="Logotipo IV Campori MBSo" 
                                    className="relative w-64 md:w-80 h-auto object-contain animate-float drop-shadow-[0_20px_30px_rgba(0,0,0,0.6)] z-20"
                                />
                            </div>
                            
                            <div className="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md text-yellow-400 px-5 py-2 rounded-full text-sm font-bold uppercase tracking-widest mb-6 border border-yellow-400/30 shadow-xl">
                                Cantina da Neta
                            </div>
                            
                            <h1 className="font-serif text-4xl md:text-6xl font-black mb-4 text-white tracking-tight drop-shadow-lg leading-tight">
                                CARDÁPIO OFICIAL
                            </h1>
                            
                            <p className="text-yellow-100 text-lg md:text-xl italic font-serif max-w-lg mx-auto leading-relaxed drop-shadow-md">
                                "A maior conquista exige a melhor energia."
                            </p>
                        </div>
                    </header>

                    {/* Navigation Tabs (Sticky e Elegante) */}
                    <div className="sticky top-0 z-50 glass-nav w-full shadow-lg">
                        <div 
                            id="tabs-container"
                            className="flex overflow-x-auto scrollbar-hide snap-x snap-mandatory px-4 py-4 md:justify-center"
                        >
                            <div className="flex space-x-3 min-w-max mx-auto px-2">
                                {menuData.map((day) => (
                                    <button
                                        key={day.id}
                                        id={`tab-${day.id}`}
                                        onClick={() => setActiveDay(day.id)}
                                        className={`
                                            snap-center relative px-6 py-3 rounded-2xl text-sm font-bold transition-all duration-300 flex items-center gap-3 select-none
                                            ${activeDay === day.id 
                                                ? 'bg-gradient-to-r from-yellow-500 to-amber-600 text-white shadow-[0_10px_20px_rgba(217,119,6,0.4)] transform scale-105 border-b-4 border-amber-700' 
                                                : 'text-stone-300 bg-white/5 hover:bg-white/20 hover:text-white border-b-4 border-transparent'}
                                        `}
                                    >
                                        <div className="flex flex-col text-left">
                                            <span className="leading-none text-base">{day.day}</span>
                                            <span className={`text-[10px] uppercase tracking-widest mt-1.5 font-black ${activeDay === day.id ? 'text-yellow-100' : 'text-stone-400'}`}>
                                                {day.date}
                                            </span>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="max-w-3xl mx-auto px-5 pt-12 pb-16 relative z-10">
                        
                        <div className="text-center mb-12" key={`header-${activeDay}`}>
                            <div className="flex justify-center mb-4">
                                <div className="p-4 bg-white/10 backdrop-blur-sm rounded-full shadow-lg border border-white/20 animate-slide-up" style={{animationDelay: '100ms'}}>
                                    {currentDayData.icon}
                                </div>
                            </div>
                            
                            <h2 className="text-4xl md:text-5xl font-serif font-black text-white drop-shadow-md mb-4 animate-slide-up" style={{animationDelay: '150ms'}}>
                                {currentDayData.day}{['quinta', 'sexta', 'segunda'].includes(currentDayData.id) ? '-Feira' : ''}
                            </h2>
                            
                            {currentDayData.theme && (
                                <div className="inline-flex items-center gap-2 px-5 py-2 bg-yellow-500 text-yellow-900 rounded-xl text-sm md:text-base font-black tracking-widest uppercase shadow-lg animate-slide-up" style={{animationDelay: '200ms'}}>
                                    {currentDayData.theme}
                                </div>
                            )}
                        </div>

                        {/* Meals Grid */}
                        <div className="space-y-8" key={`meals-${activeDay}`}>
                            {currentDayData.meals.breakfast && (
                                <MealSection 
                                    title={currentDayData.meals.breakfast.title}
                                    items={currentDayData.meals.breakfast.items}
                                    icon={Coffee}
                                    delay={300}
                                />
                            )}
                            
                            {currentDayData.meals.lunch && (
                                <MealSection 
                                    title={currentDayData.meals.lunch.title}
                                    items={currentDayData.meals.lunch.items}
                                    icon={Sun}
                                    delay={400}
                                />
                            )}
                            
                            {currentDayData.meals.dinner && (
                                <MealSection 
                                    title={currentDayData.meals.dinner.title}
                                    items={currentDayData.meals.dinner.items}
                                    icon={Moon}
                                    delay={500}
                                />
                            )}
                        </div>

                        {/* Footer Elegante */}
                        <div className="mt-16 p-10 glass-panel rounded-[2rem] text-center animate-slide-up border-t-8 border-t-yellow-500" style={{animationDelay: '600ms'}}>
                            <Leaf className="w-10 h-10 text-green-600 mx-auto mb-4 fill-current opacity-90" />
                            <p className="text-stone-800 font-serif font-bold text-xl md:text-2xl mb-2">
                                "Energia limpa, prato cheio e sem burocracia."
                            </p>
                            <p className="text-stone-500 text-xs md:text-sm mt-4 uppercase tracking-widest font-black">
                                Planejamento Ovolactovegetariano • Cantina da Neta
                            </p>
                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MenuApp />);
    </script>
</body>
</html>
