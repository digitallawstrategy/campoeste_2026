<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campori 2026 - Cantina da Neta</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Paleta clara de alto contraste, pensada para leitura por idosos */
            --bg-base: #FAF7F2;
            --bg-elevated: #FFFFFF;
            --bg-elevated-alt: #F1EBE1;
            --text-primary: #1A1A1A;
            --text-secondary: #3F3F42;
            --text-tertiary: #5B5B60;
            --accent: #9A4B08;
            --accent-strong: #F5B014;
            --border-color: #E5DFD3;
            --whatsapp-green: #1F8A3D;
        }

        html {
            /* Base já elevada; o botão A+/A- ajusta este valor em runtime */
            font-size: 112%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: var(--bg-base);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            color: var(--text-primary);
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        h1, h2, h3, .font-serif {
            font-family: 'Lora', serif;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Superfícies sólidas e leves (sem blur) — mais rápido em Android de baixa capacidade */
        .card-surface {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 10px rgba(26, 26, 26, 0.06);
        }

        .nav-surface {
            background: rgba(250, 247, 242, 0.98);
            border-bottom: 1px solid var(--border-color);
        }

        button, a {
            touch-action: manipulation;
        }

        button:focus-visible, a:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        /* Sem animações de entrada por padrão: reduz distração e uso de CPU/GPU */
        .fade-once {
            animation: none;
        }
        @media (prefers-reduced-motion: no-preference) {
            @keyframes fadeInSimple {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            .fade-once {
                animation: fadeInSimple 0.4s ease-out both;
            }
        }
    </style>
</head>
<body>
    <div id="root" class="w-full max-w-[100vw] overflow-x-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ÍCONES SVG ---
        const IconBase = ({ children, className, viewBox = "0 0 24 24" }) => (

                {children}
            </svg>
        );

        const Leaf = ({ className }) => <IconBase className={className}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></IconBase>;
        const Coffee = ({ className }) => <IconBase className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></IconBase>;
        const Sun = ({ className }) => <IconBase className={className}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconBase>;
        const Moon = ({ className }) => <IconBase className={className}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconBase>;
        const MapPin = ({ className }) => <IconBase className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>;
        const Star = ({ className }) => <IconBase className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;
        const Flame = ({ className }) => <IconBase className={className}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></IconBase>;
        const Utensils = ({ className }) => <IconBase className={className}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></IconBase>;

        const WhatsAppIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
        );

        // --- DADOS DO CARDÁPIO ---
        const menuData = [
            {
                id: 'quinta',
                day: 'Quinta',

                theme: 'Chegada & Acolhimento',
                icon: <MapPin className="w-6 h-6 text-blue-700" />,
                meals: {

                            { label: 'Prato Principal', value: 'Macarrão cremoso', highlight: true },
                            { label: 'Acompanhamento', value: 'Lasanha' },
                            { label: 'Salada', value: 'Salada' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar',
                        items: [
                            { label: 'Prato Principal', value: 'Escondidinho', highlight: true },
                            { label: 'Acompanhamento', value: 'Omelete' },

            {

                meals: {

                        ]
                    }
                }
            },
            {
                id: 'sabado',
                day: 'Sábado',
                date: '10/10',
                theme: 'Dia de Guarda',
                icon: <Sun className="w-6 h-6 text-amber-600" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã',
                        items: [
                            { label: 'Base', value: 'Pão' },
                            { label: 'Complementos', value: 'Patê e geleia' },
                            { label: 'Bolo', value: 'Bolos' },
                            { label: 'Bebidas', value: 'Suco e cevada' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço',
                        items: [
                            { label: 'Base', value: 'Arroz e Feijão' },
                            { label: 'Prato Principal', value: 'Almôndegas', highlight: true },
                            { label: 'Guarnição', value: 'Purê de batatas-baroas' },
                            { label: 'Salada', value: 'Salada' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    },
                    dinner: {
                        title: 'Jantar',
                        items: [
                            { label: 'Prato Principal', value: 'Estrogonofe', highlight: true },
                            { label: 'Base', value: 'Arroz' },
                            { label: 'Acompanhamento', value: 'Batata cremosa' },
                            { label: 'Salada', value: 'Salada' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    }
                }
            },
            {
                id: 'domingo',
                day: 'Domingo',
                date: '11/10',
                theme: 'Dia de Atividades',
                icon: <Flame className="w-6 h-6 text-red-600" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã',
                        items: [
                            { label: 'Base', value: 'Cuscuz variados' },
                            { label: 'Proteína', value: 'Ovos mexido' },
                            { label: 'Complementos', value: 'Pão, leite com cacau, patê e geleia' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    },
                    lunch: {

                        items: [

                        ]
                    },
                    dinner: {

                        items: [

                            { label: 'Molhos', value: 'Molho branco e molho vermelho' },
                            { label: 'Salada', value: 'Salada' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    }
                }
            },
            {
                id: 'segunda',
                day: 'Segunda',
                date: '12/10',
                theme: 'Encerramento & Viagem',
                icon: <MapPin className="w-6 h-6 text-emerald-700" />,
                meals: {
                    breakfast: {
                        title: 'Café da Manhã',
                        items: [
                            { label: 'Base', value: 'Cuscuz temperado' },
                            { label: 'Quente', value: 'Canjiquinha' },
                            { label: 'Fruta', value: 'Frutas' },
                            { label: 'Bebida', value: 'Suco' }
                        ]
                    },
                    lunch: {
                        title: 'Almoço',
                        items: [
                            { label: 'Base', value: 'Arroz e Feijão' },
                            { label: 'Prato Principal', value: 'Torta fria', highlight: true },
                            { label: 'Guarnição', value: 'Batata frita' },
                            { label: 'Acompanhamento', value: 'Abobrinha gratinada' },
                            { label: 'Salada', value: 'Salada' }
                        ]
                    },
                    dinner: {
                        title: 'Kit Viagem',
                        items: [
                            { label: 'Lanche', value: 'Sanduíche Natural', highlight: true },
                            { label: 'Opção Tradicional', value: 'Patê Cremoso de Frango', type: 'meat' },
                            { label: 'Opção Vegetariana', value: 'Patê de Cenoura com Ervas', type: 'veg' },
                            { label: 'Fruta', value: 'Frutas para viagem' }
                        ]
                    }
                }
            }
        ];

        // --- COMPONENTES ---

        const MenuItem = ({ label, value, type, highlight }) => {
            let badgeClass = "";
            let textClass = "text-[var(--text-primary)]";
            let bgClass = "";

            if (type === 'meat') {
                badgeClass = "bg-red-100 text-red-800 border border-red-300";
                textClass = "text-[var(--text-primary)] text-lg md:text-xl font-medium";
            } else if (type === 'veg') {
                badgeClass = "bg-emerald-100 text-emerald-800 border border-emerald-300";
                textClass = "text-[var(--text-primary)] text-lg md:text-xl font-medium";
            } else if (highlight) {
                bgClass = "bg-amber-50 border-l-4 border-[var(--accent-strong)] pl-4 py-2.5 my-2 rounded-r-lg";
                textClass = "text-[var(--text-primary)] font-semibold text-lg md:text-xl";
            } else {
                textClass = "text-[var(--text-secondary)] font-normal text-base md:text-lg";
            }

            return (
                <div className={`mb-5 last:mb-0 ${bgClass}`}>
                    <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                        <span className="text-sm md:text-base uppercase tracking-[0.04em] text-[var(--text-tertiary)] font-semibold">
                            {label}
                        </span>
                        {type === 'meat' && (
                            <span className={`text-sm px-2.5 py-0.5 rounded-md font-semibold ${badgeClass}`}>
                                Opção Tradicional
                            </span>
                        )}
                        {type === 'veg' && (
                            <span className={`text-sm px-2.5 py-0.5 rounded-md font-semibold ${badgeClass}`}>
                                Opção Vegetariana
                            </span>
                        )}
                    </div>
                    <div className={`leading-relaxed ${textClass}`}>
                        {value}
                    </div>
                </div>
            );
        };

        const MealSection = ({ title, items, icon: Icon }) => {
            if (!items) return null;

            return (
                <div className="card-surface rounded-2xl p-5 md:p-7 mb-6">
                    <div className="flex items-center gap-3.5 mb-5 pb-4 border-b-2" style={{ borderColor: 'var(--border-color)' }}>
                        <div className="flex items-center justify-center w-11 h-11 md:w-12 md:h-12 rounded-full shrink-0" style={{ background: 'var(--bg-elevated-alt)', color: 'var(--accent)' }}>
                            <Icon className="w-6 h-6" />
                        </div>
                        <h3 className="font-serif text-2xl md:text-3xl font-semibold tracking-tight" style={{ color: 'var(--text-primary)' }}>
                            {title}
                        </h3>
                    </div>
                    <div className="space-y-0">
                        {items.map((item, idx) => (
                            <MenuItem key={idx} {...item} />
                        ))}
                    </div>
                </div>
            );
        };

        // --- CABEÇALHO DO DIA ---
        const DayHeader = ({ dayData }) => {
            const formatFullDate = (dateString) => {
                const [day, month] = dateString.split('/');
                const months = { '10': 'Outubro' };
                return `${day} de ${months[month] || 'Outubro'}`;
            };

            const dayName = `${dayData.day}${['quinta', 'sexta', 'segunda'].includes(dayData.id.toLowerCase()) ? '-feira' : ''}`;

            return (
                <div className="mb-6 flex items-center justify-between gap-4">
                    <div>
                        <h2 className="text-3xl md:text-4xl font-serif font-semibold tracking-tight flex flex-col md:flex-row md:items-baseline md:gap-3" style={{ color: 'var(--text-primary)' }}>
                            <span>{dayName}</span>
                            <span className="text-lg md:text-xl font-sans font-semibold mt-0.5 md:mt-0" style={{ color: 'var(--accent)' }}>
                                {formatFullDate(dayData.date)}
                            </span>
                        </h2>
                        {dayData.theme && (
                            <span className="text-base font-semibold tracking-wide uppercase mt-1.5 block" style={{ color: 'var(--text-secondary)' }}>
                                {dayData.theme}
                            </span>
                        )}
                    </div>
                    <div className="p-3 rounded-full shrink-0" style={{ background: 'var(--bg-elevated-alt)', border: '1px solid var(--border-color)' }}>
                        {dayData.icon}
                    </div>
                </div>
            );

        // --- BOTÃO DO WHATSAPP ---
        const FloatingWhatsAppButton = () => {
            const phoneNumber = "5577999052417";
            const message = encodeURIComponent("Olá! Gostaria de falar sobre o cardápio e fazer uma reserva na Cantina da Neta para o Campori 2026.");
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;

            return (
                <a
                    href={whatsappUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="fixed bottom-6 right-5 md:bottom-8 md:right-8 z-[60] flex items-center gap-2.5 text-white px-5 py-4 md:px-6 md:py-4 rounded-full shadow-lg hover:brightness-95 transition-[filter] duration-150"
                    style={{ background: 'var(--whatsapp-green)', WebkitTapHighlightColor: 'transparent' }}
                    aria-label="Fazer reserva via WhatsApp"
                >
                    <WhatsAppIcon className="w-6 h-6" />
                    <span className="font-semibold text-base md:text-lg pr-1">Reservas</span>
                </a>
            );
        };

        // --- CONTROLE DE TAMANHO DE FONTE (ACESSIBILIDADE) ---
        const FONT_STEPS = ['100%', '112%', '124%', '136%', '148%'];
        const FONT_KEY = 'campori-font-step';

        const FontSizeControl = () => {
            const [step, setStep] = useState(() => {
                const saved = parseInt(localStorage.getItem(FONT_KEY), 10);
                return Number.isInteger(saved) && saved >= 0 && saved < FONT_STEPS.length ? saved : 1;
            });

            useEffect(() => {
                document.documentElement.style.fontSize = FONT_STEPS[step];
                localStorage.setItem(FONT_KEY, String(step));
            }, [step]);

            return (
                <div
                    className="fixed bottom-6 left-5 md:bottom-8 md:left-8 z-[60] flex items-stretch rounded-full shadow-lg overflow-hidden"
                    style={{ background: 'var(--bg-elevated)', border: '2px solid var(--border-color)' }}
                >
                    <button
                        onClick={() => setStep(s => Math.max(0, s - 1))}
                        disabled={step === 0}
                        aria-label="Diminuir tamanho da letra"
                        className="px-4 py-3.5 md:px-5 md:py-4 text-xl font-bold disabled:opacity-30"
                        style={{ color: 'var(--text-primary)' }}
                    >
                        A-
                    </button>
                    <span style={{ width: '2px', background: 'var(--border-color)' }}></span>
                    <button
                        onClick={() => setStep(s => Math.min(FONT_STEPS.length - 1, s + 1))}
                        disabled={step === FONT_STEPS.length - 1}
                        aria-label="Aumentar tamanho da letra"
                        className="px-4 py-3.5 md:px-5 md:py-4 text-xl font-bold disabled:opacity-30"
                        style={{ color: 'var(--text-primary)' }}
                    >
                        A+
                    </button>
                </div>
            );
        };

        const MenuApp = () => {
            const [activeTab, setActiveTab] = useState(menuData[0].id);

            // Observer para atualizar a nav conforme o scroll
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setActiveTab(entry.target.id);
                            const activeBtn = document.getElementById(`tab-${entry.target.id}`);
                            const container = document.getElementById('tabs-container');
                            if (activeBtn && container) {
                                const scrollPos = activeBtn.offsetLeft - (container.offsetWidth / 2) + (activeBtn.offsetWidth / 2);
                                container.scrollTo({ left: scrollPos, behavior: 'smooth' });
                            }
                        }
                    });
                }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });

                menuData.forEach(day => {
                    const el = document.getElementById(day.id);
                    if (el) observer.observe(el);
                });

                return () => observer.disconnect();
            }, []);

            const scrollToSection = (dayId) => {
                const el = document.getElementById(dayId);
                if (el) {
                    const yOffset = el.getBoundingClientRect().top + window.scrollY - 76;
                    window.scrollTo({ top: yOffset, behavior: 'smooth' });
                }
            };

            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Ícone seta para cima
            const ChevronUp = ({ className }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="m18 15-6-6-6 6"/>
                </svg>
            );

            return (
                <div className="min-h-screen font-sans antialiased" style={{ color: 'var(--text-primary)', background: 'var(--bg-base)' }}>

                    {/* Header Topo */}
                    <header id="topo" className="pt-10 pb-6 px-5 max-w-2xl mx-auto flex flex-col items-center justify-center text-center fade-once">

                        <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-sm font-semibold uppercase tracking-[0.06em] mb-6"
                             style={{ background: '#FDF0D8', color: 'var(--accent)', border: '1px solid #EFD9A8' }}>
                            <Utensils className="w-4 h-4" />
                            <span>Cantina da Neta</span>
                        </div>

                        <div className="flex items-center justify-center gap-4 mb-4">
                            <img
                                src="./compori.png"
                                alt="Logo"
                                className="w-14 md:w-16 h-auto object-contain"
                                onError={(e) => {
                                    const fallbackUrl = 'https://raw.githubusercontent.com/digitallawstrategy/campoeste_2026/main/compori.png';
                                    if (e.target.src !== fallbackUrl) e.target.src = fallbackUrl;
                                    else e.target.style.display = 'none';
                                }}
                            />
                            <h1 className="font-serif text-4xl md:text-5xl font-semibold tracking-tight leading-tight m-0" style={{ color: 'var(--text-primary)' }}>
                                Cardápio<br />
                                <span style={{ color: 'var(--accent)' }}>Oficial</span>
                            </h1>
                        </div>

                        <p className="text-base md:text-lg italic font-serif text-center mt-1" style={{ color: 'var(--text-secondary)' }}>
                            "A maior conquista exige a melhor energia."
                        </p>
                    </header>

                    {/* Navigation Tabs (Fixas no topo — rolam até a seção) */}
                    <div className="sticky top-0 z-50 nav-surface w-full">
                        <div
                            id="tabs-container"
                            className="flex overflow-x-auto scrollbar-hide snap-x snap-mandatory px-4 py-3 md:justify-center"
                            style={{ WebkitOverflowScrolling: 'touch' }}
                        >
                            <div className="flex space-x-3 min-w-max mx-auto px-2">
                                {menuData.map((day) => {
                                    const isActive = activeTab === day.id;
                                    return (
                                        <button
                                            key={day.id}
                                            id={`tab-${day.id}`}
                                            onClick={() => scrollToSection(day.id)}
                                            className="snap-center rounded-xl transition-colors duration-150 flex items-center justify-center min-w-[92px] px-5 py-3.5 md:py-4"
                                            style={isActive
                                                ? { background: 'var(--text-primary)', color: '#FFFFFF', border: '1px solid var(--text-primary)' }
                                                : { background: 'var(--bg-elevated-alt)', color: 'var(--text-secondary)', border: '1px solid var(--border-color)' }
                                            }
                                        >
                                            <div className="flex flex-col text-center pointer-events-none">
                                                <span className={`text-base md:text-lg ${isActive ? 'font-bold' : 'font-semibold'}`}>
                                                    {day.day}
                                                </span>
                                                <span className="text-sm mt-0.5" style={{ color: isActive ? 'var(--accent-strong)' : 'inherit', opacity: isActive ? 1 : 0.75 }}>
                                                    {day.date}
                                                </span>
                                            </div>
                                        </button>
                                    )
                                })}
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area — Todos os dias em sequência */}
                    <main className="max-w-2xl mx-auto px-5 pt-8 pb-32 relative z-10">

                        {menuData.map((dayData, dayIndex) => (
                            <section key={dayData.id} id={dayData.id} className="mb-4">

                                {/* Checkpoint de navegação (a partir do segundo dia) */}
                                {dayIndex > 0 && (
                                    <div className="flex items-center justify-center gap-3 mb-8 pt-4">
                                        <button
                                            onClick={() => scrollToSection(menuData[dayIndex - 1].id)}
                                            className="flex items-center gap-1.5 transition-colors duration-150 text-sm md:text-base font-semibold px-4 py-2.5 rounded-lg"
                                            style={{ color: 'var(--text-secondary)', background: 'var(--bg-elevated-alt)', border: '1px solid var(--border-color)' }}
                                        >
                                            <ChevronUp className="w-4 h-4" />
                                            {menuData[dayIndex - 1].day}
                                        </button>
                                        <button
                                            onClick={scrollToTop}
                                            className="flex items-center gap-1.5 transition-colors duration-150 text-sm md:text-base font-semibold px-4 py-2.5 rounded-lg"
                                            style={{ color: 'var(--accent)', background: 'var(--bg-elevated-alt)', border: '1px solid var(--border-color)' }}
                                        >
                                            <ChevronUp className="w-4 h-4" />
                                            Início
                                        </button>
                                    </div>
                                )}

                                <DayHeader dayData={dayData} />

                                <div className="space-y-5">
                                    {dayData.meals.breakfast && (
                                        <MealSection
                                            title={dayData.meals.breakfast.title}
                                            items={dayData.meals.breakfast.items}
                                            icon={Coffee}
                                        />
                                    )}

                                    {dayData.meals.lunch && (
                                        <MealSection
                                            title={dayData.meals.lunch.title}
                                            items={dayData.meals.lunch.items}
                                            icon={Sun}
                                        />
                                    )}

                                    {dayData.meals.dinner && (
                                        <MealSection
                                            title={dayData.meals.dinner.title}
                                            items={dayData.meals.dinner.items}
                                            icon={Moon}
                                        />
                                    )}
                                </div>

                            </section>
                        ))}

                        {/* Footer Minimalista */}
                        <div className="mt-10 mb-8 flex flex-col items-center justify-center text-center">
                            <Leaf className="w-6 h-6 mb-2" style={{ color: 'var(--text-secondary)' }} />
                            <p className="text-sm uppercase tracking-[0.08em] font-semibold" style={{ color: 'var(--text-tertiary)' }}>
                                Opções Tradicionais & Veg <br/> Cantina da Neta
                            </p>
                        </div>

                    </main>

                    {/* Botões Flutuantes */}
                    <FontSizeControl />
                    <FloatingWhatsAppButton />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MenuApp />);
    </script>
</body>
</html>
